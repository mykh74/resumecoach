# Systemd service file for ResumeCoach Backend
# Location: /etc/systemd/system/resumecoach-backend.service

[Unit]
Description=ResumeCoach FastAPI Backend
After=network.target

[Service]
Type=notify
User=ubuntu
Group=ubuntu
WorkingDirectory=/home/ubuntu/resumecoach
Environment="PATH=/home/ubuntu/resumecoach/venv/bin"
EnvironmentFile=/home/ubuntu/resumecoach/.env.production

# Start command with Gunicorn
ExecStart=/home/ubuntu/resumecoach/venv/bin/gunicorn \
    backend.main:app \
    --workers 4 \
    --worker-class uvicorn.workers.UvicornWorker \
    --bind 0.0.0.0:8000 \
    --timeout 300 \
    --access-logfile /var/log/resumecoach/access.log \
    --error-logfile /var/log/resumecoach/error.log \
    --log-level info \
    --pid /run/resumecoach/backend.pid

# Process management
Restart=always
RestartSec=10
KillMode=mixed
KillSignal=SIGTERM
TimeoutStopSec=30

# Security settings
NoNewPrivileges=true
PrivateTmp=true

# Resource limits
LimitNOFILE=65535
LimitNPROC=4096

# Logging
StandardOutput=journal
StandardError=journal
SyslogIdentifier=resumecoach-backend

[Install]
WantedBy=multi-user.target
